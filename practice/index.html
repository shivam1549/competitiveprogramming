        // new Promise(res… — this creates a new promise and everything written inside the callback of Promise() is a synchronous task, so it will be executed on the go.

            console.log("A");
            await Promise.resolve();
            console.log("B");
            await new Promise(resolve => setTimeout(resolve, 0));
